name: Release

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Cachix token used to push built store paths
        required: false
      CACHIX_SIGNING_KEY:
        description: Cachix signing key used to push built store paths
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0} # zizmor: ignore[misfeature]
    permissions:
      contents: write # Version commits, tags and GitHub releases
      pull-requests: write # Version pull requests opened by Changesets
      packages: write # Publishes to the GitHub Package Registry
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          push-name: ${{ vars.CACHIX_PUSH_CACHE }}
          pull-names: ${{ vars.CACHIX_PULL_CACHES }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }} # zizmor: ignore[secrets-outside-env]
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }} # zizmor: ignore[secrets-outside-env]
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Changesets spawns Node, npm and Yarn directly, so they have to be
      # resolvable outside of the nix develop shell. The nix shell's Yarn 1
      # shadows the release pinned by .yarnrc.yml, so link that instead.
      - name: Add Node, npm and Yarn to PATH
        run: |
          bindir="$RUNNER_TEMP/bin"
          mkdir -p "$bindir"
          yarn_path="$(grep -oE 'yarnPath: .*' .yarnrc.yml | cut -d' ' -f2)"
          ln -sf "$PWD/$yarn_path" "$bindir/yarn"
          ln -sf "$(command -v node)" "$bindir/node"
          ln -sf "$(command -v npm)" "$bindir/npm"
          echo "$bindir" >>"$GITHUB_PATH"

      - name: Configure npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          registry-url: https://npm.pkg.github.com

      # Recent Yarn reads neither the registry mapping nor the token from
      # .npmrc; put the scope in the home yarnrc instead.
      - name: Setup .yarnrc.yml
        run: |
          yarn config set --home "npmScopes.$SCOPE.npmRegistryServer" "$REGISTRY"
          yarn config set --home "npmScopes.$SCOPE.npmAlwaysAuth" true
          yarn config set --home "npmScopes.$SCOPE.npmAuthToken" "$TOKEN"
          yarn config set --home "npmRegistries[\"$REGISTRY\"].npmAuthToken" "$TOKEN"
          yarn config set --home "npmRegistries[\"$REGISTRY\"].npmAlwaysAuth" true
        env:
          REGISTRY: https://npm.pkg.github.com
          SCOPE: throwparty
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Version or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # ratchet:changesets/action@v2.1.2
        with:
          publish-script: yarn run changeset publish
          version-script: yarn run changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
