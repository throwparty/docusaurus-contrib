name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop ./nix --command bash -euo pipefail {0} # zizmor: ignore[misfeature]
    permissions:
      contents: write # Version commits, tags and GitHub releases
      pull-requests: write # Version pull requests opened by Changesets
      packages: write # Publishes to the GitHub Package Registry
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nix
        uses: $/.github/actions/setup-nix
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Changesets spawns Node, npm and Yarn directly, so they have to be
      # resolvable outside of the nix develop shell. The nix shell's Yarn 1
      # shadows the release pinned by .yarnrc.yml, so link that instead.
      - name: Add Node, npm and Yarn to PATH
        run: |
          bindir="$RUNNER_TEMP/bin"
          mkdir -p "$bindir"
          yarn_path="$(grep -oE 'yarnPath: .*' .yarnrc.yml | cut -d' ' -f2)"
          ln -sf "$PWD/$yarn_path" "$bindir/yarn"
          ln -sf "$(command -v node)" "$bindir/node"
          ln -sf "$(command -v npm)" "$bindir/npm"
          echo "$bindir" >>"$GITHUB_PATH"

      - name: Configure npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: yarn install --immutable

      - name: Version or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # ratchet:changesets/action@v2.1.2
        with:
          version: yarn run changeset version
          publish: yarn run changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
